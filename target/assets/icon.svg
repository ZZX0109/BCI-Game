<?xml version="1.0" encoding="UTF-8"?>
<!-- 精准打靶：同心环靶 + 十字准星 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#15222c"/>
  <!-- 同心靶环 -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#e8eeee" stroke-width="5"/>
  <circle cx="64" cy="64" r="24" fill="none" stroke="#e8eeee" stroke-width="4" opacity="0.6"/>
  <!-- 靶心（琥珀） -->
  <circle cx="64" cy="64" r="9" fill="#ffdf70"/>
  <!-- 准星十字（露出靶外四端） -->
  <line x1="64" y1="12" x2="64" y2="34" stroke="#e8eeee" stroke-width="5" stroke-linecap="round"/>
  <line x1="64" y1="94" x2="64" y2="116" stroke="#e8eeee" stroke-width="5" stroke-linecap="round"/>
  <line x1="12" y1="64" x2="34" y2="64" stroke="#e8eeee" stroke-width="5" stroke-linecap="round"/>
  <line x1="94" y1="64" x2="116" y2="64" stroke="#e8eeee" stroke-width="5" stroke-linecap="round"/>
</svg>
