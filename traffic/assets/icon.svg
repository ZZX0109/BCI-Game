  <circle cx="89" cy="84" r="4" fill="#3E8A5A" stroke="#FFFFFF" stroke-width="3"/>
  <circle cx="105" cy="84" r="4" fill="#3E8A5A" stroke="#FFFFFF" stroke-width="3"/>
  <!-- 行人 -->
