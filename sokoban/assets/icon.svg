<?xml version="1.0" encoding="UTF-8"?>
<!-- 推箱子：棋盘格 + 箱子推上目标环 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#15222c"/>
  <!-- 地板格 -->
  <rect x="22" y="22" width="84" height="84" rx="8" fill="none" stroke="#e8eeee" stroke-width="4"/>
  <line x1="22" y1="50" x2="106" y2="50" stroke="#e8eeee" stroke-width="3" opacity="0.35"/>
  <line x1="22" y1="78" x2="106" y2="78" stroke="#e8eeee" stroke-width="3" opacity="0.35"/>
  <line x1="50" y1="22" x2="50" y2="106" stroke="#e8eeee" stroke-width="3" opacity="0.35"/>
  <line x1="78" y1="22" x2="78" y2="106" stroke="#e8eeee" stroke-width="3" opacity="0.35"/>
  <!-- 箱子（琥珀）+ 目标环 -->
  <rect x="55" y="55" width="18" height="18" rx="3" fill="#ffdf70"/>
  <circle cx="40" cy="40" r="9" fill="none" stroke="#e8eeee" stroke-width="4"/>
  <!-- 玩家点 -->
  <circle cx="90" cy="96" r="5" fill="#e8eeee"/>
</svg>
