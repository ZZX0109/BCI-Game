<?xml version="1.0" encoding="UTF-8"?>
<!-- 追光球：深紫夜空底，琥珀目标 + 青玩家球 + 轨迹 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="24" fill="#3A2A6E"/>
  <!-- 星点 -->
  <circle cx="24" cy="24" r="2.5" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="104" cy="18" r="2" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="112" cy="72" r="2.5" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="18" cy="66" r="2" fill="#FFFFFF" opacity="0.4"/>
  <!-- 目标容差圈（虚线） -->
  <circle cx="78" cy="50" r="26" fill="none" stroke="#FFDF70" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round"/>
  <circle cx="78" cy="50" r="12" fill="#FFDF70"/>
  <!-- 玩家追踪球（青） -->
  <circle cx="40" cy="84" r="10" fill="#7BE0D4"/>
  <path d="M46 74 Q52 62 64 58" fill="none" stroke="#7BE0D4" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
</svg>
